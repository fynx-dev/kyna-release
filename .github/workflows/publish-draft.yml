name: Publish verified draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag in vX.Y.Z format
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish ${{ inputs.tag }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag and draft state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'The tag must use vX.Y.Z format.'
          }
          $release = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json databaseId,isDraft | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release $env:RELEASE_TAG is not a draft."
          }
          "RELEASE_ID=$($release.databaseId)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Download draft assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --dir assets --pattern "Kyna-$env:RELEASE_TAG-windows-x64.exe" --pattern SHA256SUMS

      - name: Verify checksum and installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedInstaller = "Kyna-$env:RELEASE_TAG-windows-x64.exe"
          $actualAssets = @(Get-ChildItem -LiteralPath assets -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedAssets = @($expectedInstaller, 'SHA256SUMS') | Sort-Object
          if (@(Compare-Object -ReferenceObject $expectedAssets -DifferenceObject $actualAssets).Count -ne 0) {
            throw "Draft assets must be exactly $($expectedAssets -join ', '); got $($actualAssets -join ', ')."
          }

          $installer = Join-Path assets $expectedInstaller
          $expectedChecksum = (Get-Content -LiteralPath (Join-Path assets SHA256SUMS) -Raw).Trim()
          $actualChecksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedChecksum -ne "$actualChecksum *$expectedInstaller") {
            throw 'SHA256SUMS does not match the release installer.'
          }

          $extractDirectory = Join-Path $PWD 'extracted'
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$extractDirectory"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Release installer exited with $($install.ExitCode)."
          }
          foreach ($path in @('kyna_player.exe', 'kyna_subtitle.exe', 'whisper\whisper-cli.exe', 'providers')) {
            $installedPath = Join-Path $extractDirectory $path
            if (-not (Test-Path -LiteralPath $installedPath)) {
              throw "Release installer is missing $path."
            }
            if ((Get-Item -LiteralPath $installedPath).PSIsContainer -and -not @(Get-ChildItem -LiteralPath $installedPath -Force | Select-Object -First 1)) {
              throw "Release installer contains an empty $path."
            }
          }
          & (Join-Path $extractDirectory 'kyna_subtitle.exe') --version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged kyna_subtitle.exe --version exited with $LASTEXITCODE."
          }

      - name: Publish verified draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh api --method PATCH "repos/$env:GH_REPO/releases/$env:RELEASE_ID" -f draft=false | Out-Null
