name: Feature request
description: Suggest an observable user-facing improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: input
    id: kyna_version
    attributes:
      label: Kyna version
      placeholder: vX.Y.Z or not installed
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow and its current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what a user should be able to observe or do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
