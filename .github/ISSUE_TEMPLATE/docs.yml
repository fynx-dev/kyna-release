name: Documentation issue
description: Report missing, unclear, or incorrect release documentation.
title: "[Docs]: "
labels: [documentation, needs-triage]
body:
  - type: input
    id: page
    attributes:
      label: Documentation page or link
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested correction
    validations:
      required: false
